# nFPM configuration for the deb, rpm and apk packages; scripts/linux-packages.sh sets the variables.
name: xmtr
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
release: 1
section: net
priority: optional
maintainer: Alice39s <xmtr.opensource@xmsl.dev>
description: |-
  Concurrent traceroute that maps every hop on xmsl.dev IPMap
  xmtr traces several targets at once with trippy, stops each route when its
  path is stable, and uploads the routes to xmsl.dev IPMap, which places every
  hop on a map.
vendor: Alice39s
homepage: https://github.com/Alice39s/xmtr
license: MIT OR Apache-2.0
contents:
  - src: ${PKG_BINARY}
    dst: /usr/bin/xmtr
    expand: true
    file_info:
      mode: 0755
  - src: LICENSE-MIT
    dst: /usr/share/licenses/xmtr/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/licenses/xmtr/LICENSE-APACHE
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/postinstall.sh
overrides:
  deb:
    recommends:
      - libcap2-bin
  apk:
    depends:
      - libcap-setcap
rpm:
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
apk:
  scripts:
    postupgrade: packaging/linux/postinstall.sh
  signature:
    key_file: ${APK_SIGNING_KEY_FILE}
    key_name: xmtr
