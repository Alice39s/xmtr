[project]
name = "xmtr-ci"
version = "0.1.0"
description = "Builds, checks and publishes the xmtr release"
authors = [{ name = "Alice39s", email = "xmtr.opensource@xmsl.dev" }]
license = "MIT OR Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.0.0",
    "packaging>=26.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-gnupg>=0.5.7",
    "rich>=15.0.0",
    "stamina>=26.1.0",
    "twine>=6.2.0",
    "typer>=0.27.3",
    "wheel>=0.48.0",
]

[project.scripts]
xmtr-ci = "xmtr_ci.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "inline-snapshot>=0.36.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "CPY", "D", "EM", "FBT", "S202", "S603", "S607", "S701", "T201", "TC", "TD",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]

[tool.pytest]
addopts = ["--strict-markers"]
testpaths = ["tests"]
