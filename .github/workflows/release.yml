name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"
  UV_PROJECT: scripts/ci
  UV_LOCKED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      smoke: ${{ steps.matrix.outputs.smoke }}
      android: ${{ steps.matrix.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: knope
      - uses: ./.github/actions/xmtr-ci
      - id: matrix
        run: uv run xmtr-ci matrix
      - run: uv run xmtr-ci check scripts
      - run: uv run xmtr-ci check release
      - run: uv run xmtr-ci check rust

  msrv:
    name: MSRV ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs .#xmtr
      - run: ./result/bin/xmtr --version

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci check rust --no-fmt

  build:
    name: build ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.build) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.tool }}
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: xmtr-${{ matrix.target }}
          path: dist/*

  # Linux, macOS and Windows builds run natively where a hosted runner has the CPU and under QEMU
  # user emulation otherwise. Each one also traces 127.0.0.1.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: [check, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: xmtr-${{ matrix.target }}
          path: dist
      - if: matrix.apt
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ matrix.apt }}
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci smoke ${{ matrix.target }} --trace

  smoke-freebsd:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: xmtr-x86_64-unknown-freebsd
          path: dist
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          sync: sshfs
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci smoke x86_64-unknown-freebsd --trace

  # Android builds run as root in the Termux image, the ARM ones under QEMU.
  smoke-android:
    name: smoke ${{ matrix.target }}
    needs: [check, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.android) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: xmtr-${{ matrix.target }}
          path: dist
      - if: matrix.image == 'aarch64' || matrix.image == 'arm'
        uses: docker/setup-qemu-action@v4
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci smoke ${{ matrix.target }} --trace

  # Builds the npm, PyPI, deb, rpm and apk packages from the archives and installs each one once.
  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci package npm
      - run: uv run xmtr-ci package wheels
      # Pull requests from forks get no secrets, so their rpm and apk packages stay unsigned.
      - env:
          PACKAGES_GPG_KEY: ${{ github.event_name != 'pull_request' && secrets.PACKAGES_GPG_KEY || '' }}
          APK_SIGNING_KEY: ${{ github.event_name != 'pull_request' && secrets.APK_SIGNING_KEY || '' }}
        run: uv run xmtr-ci package linux
      - run: uv run xmtr-ci package test npm wheels deb rpm apk
      - uses: actions/upload-artifact@v4
        with:
          name: packages-npm
          path: packages/npm/**/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: packages-wheels
          path: packages/wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: packages/linux/*

  # Packs the Chocolatey package with the Windows archives embedded and installs it once.
  chocolatey:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*-pc-windows-gnu
          path: dist
          merge-multiple: true
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci package chocolatey
      - run: uv run xmtr-ci package test chocolatey
      - uses: actions/upload-artifact@v4
        with:
          name: packages-chocolatey
          path: packages/*.nupkg

  # Builds the image for every platform; the amd64 image runs once.
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*-linux-musl*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci docker test

  alpine:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci alpine build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, nix, build, smoke, smoke-freebsd, smoke-android, packages, chocolatey, docker, alpine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: packages-linux
          path: dist
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci release prepare
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      # Releases are immutable once published, so every file is attached to a draft first.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run xmtr-ci release publish

  crates:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - uses: ./.github/actions/xmtr-ci
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: uv run xmtr-ci publish crates

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_KEY }}
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci publish homebrew

  scoop:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SCOOP_BUCKET_KEY }}
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci publish scoop

  # Builds the package once in Arch Linux to check the sources and checksums, and writes .SRCINFO.
  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: vars.AUR_ENABLED == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_KEY }}
      - uses: ./.github/actions/xmtr-ci
      - run: uv run xmtr-ci publish aur ${{ vars.AUR_ENABLED == 'true' && '--push' || '--no-push' }}

  winget:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/xmtr-ci
      # The action updates an existing package, so it runs once the first version is in winget-pkgs.
      - id: listed
        run: uv run xmtr-ci publish winget-listed
      - if: steps.listed.outputs.listed == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Alice39s.xmtr
          installers-regex: '^xmtr-.*-windows-.*\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v5
        with:
          name: packages-npm
          path: npm
      - uses: ./.github/actions/xmtr-ci
      # Trusted publishing signs in through OIDC. The platform packages go first, so @xmtr/cli
      # never points at a version that is missing.
      - run: uv run xmtr-ci publish npm

  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages-wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  # Publishes the apt, dnf and apk repositories at https://alice39s.github.io/xmtr/.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: packages-linux
          path: packages
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: reprepro createrepo-c
      - uses: ./.github/actions/xmtr-ci
      - env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: uv run xmtr-ci repositories
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  docker-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*-linux-musl*
          path: dist
          merge-multiple: true
      - uses: ./.github/actions/xmtr-ci
      - id: context
        run: uv run xmtr-ci docker context
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: packaging/Dockerfile
          platforms: ${{ steps.context.outputs.platforms }}
          push: true
          tags: ${{ steps.context.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Alice39s/xmtr
            org.opencontainers.image.version=${{ steps.context.outputs.version }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          annotations: |
            index:org.opencontainers.image.source=https://github.com/Alice39s/xmtr
            index:org.opencontainers.image.description=Concurrent traceroute that maps every hop on xmsl.dev IPMap
            index:org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/alice39s/xmtr
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # New versions wait for moderation before they appear on community.chocolatey.org. Until the
  # package's first version is approved, the community repository accepts no other version, so the
  # push is left to a release that follows the approval.
  chocolatey-publish:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: packages-chocolatey
          path: packages
      - uses: ./.github/actions/xmtr-ci
      - env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: uv run xmtr-ci publish chocolatey

  # Installs the published release through each channel on each hosted OS and CPU. Chocolatey and
  # WinGet are left out: their new versions wait for review.
  verify:
    name: verify ${{ matrix.os }}
    needs: [crates, homebrew, scoop, npm, pypi, pages, docker-publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: runner.os != 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - uses: ./.github/actions/xmtr-ci
      # cargo-binstall looks the release up through the GitHub API, which rate-limits anonymous calls.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run xmtr-ci verify
