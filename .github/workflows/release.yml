name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: shellcheck install.sh scripts/*.sh packaging/linux/postinstall.sh
      - run: node --check packaging/npm/xmtr.js
      - name: The xmtr-release dependency matches the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xmtr") | .version')"
          required="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xmtr") | .dependencies[] | select(.name == "xmtr-release") | .req')"
          [ "$required" = "^$version" ] || { echo "xmtr-release is required as $required, expected ^$version"; exit 1; }
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xmtr") | .version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs .#xmtr
      - run: ./result/bin/xmtr --version

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  zigbuild:
    name: zigbuild ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-gnu
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          - loongarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - i686-pc-windows-gnu
          - aarch64-pc-windows-gnullvm
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --workspace --target ${{ matrix.target }}
      - run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: xmtr-${{ matrix.target }}
          path: dist/*

  cross:
    name: cross ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - powerpc64-unknown-linux-gnu
          - sparc64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --locked --workspace --target ${{ matrix.target }}
      - run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: xmtr-${{ matrix.target }}
          path: dist/*

  android:
    name: android ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk --platform 24 --target ${{ matrix.target }} build --release --locked --workspace
      - run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: xmtr-${{ matrix.target }}
          path: dist/*

  # Builds the npm, PyPI, deb, rpm and apk packages from the archives and installs each one once.
  packages:
    needs: [zigbuild, cross, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install wheel packaging twine
      - name: Install nFPM
        run: |
          curl -fsSLO https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm_2.48.0_Linux_x86_64.tar.gz" | sha256sum -c
          sudo tar -xzf nfpm_2.48.0_Linux_x86_64.tar.gz -C /usr/local/bin nfpm
      - id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xmtr") | .version')" >> "$GITHUB_OUTPUT"
      # Pull requests from forks get no secrets, so their rpm and apk packages stay unsigned.
      - name: Signing keys
        if: github.event_name != 'pull_request'
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          printf '%s\n' "$PACKAGES_GPG_KEY" > "$RUNNER_TEMP/xmtr-gpg.asc"
          printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/xmtr.rsa"
          echo "RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/xmtr-gpg.asc" >> "$GITHUB_ENV"
          echo "APK_SIGNING_KEY_FILE=$RUNNER_TEMP/xmtr.rsa" >> "$GITHUB_ENV"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/npm-packages.sh "$VERSION" dist packages/npm
          scripts/wheels.sh "$VERSION" dist packages/wheels
          scripts/linux-packages.sh "$VERSION" dist packages/linux
      - name: Install every format once
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --global "packages/npm/platforms/xmtr-linux-x64-${VERSION}.tgz" "packages/npm/xmtr-cli-${VERSION}.tgz"
          xmtr --version
          twine check packages/wheels/*.whl
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install packages/wheels/*manylinux*x86_64*.whl
          "$RUNNER_TEMP/venv/bin/xmtr" --version
          sudo dpkg --install packages/linux/xmtr_*_amd64.deb
          /usr/bin/xmtr --version
          getcap /usr/bin/xmtr | grep cap_net_raw
          docker run --rm -v "$PWD/packages/linux:/pkg:ro" fedora:latest sh -euc 'rpm --install --nosignature /pkg/*.x86_64.rpm && xmtr --version'
          docker run --rm -v "$PWD/packages/linux:/pkg:ro" alpine:latest sh -euc 'apk add --quiet --allow-untrusted /pkg/*_x86_64.apk && xmtr --version'
      - uses: actions/upload-artifact@v4
        with:
          name: packages-npm
          path: packages/npm/**/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: packages-wheels
          path: packages/wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: packages/linux/*

  # Packs the Chocolatey package with the Windows archives embedded and installs it once.
  chocolatey:
    needs: zigbuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*-pc-windows-gnu
          path: dist
          merge-multiple: true
      - id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xmtr") | .version')" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: scripts/chocolatey.sh "${{ steps.version.outputs.version }}" dist packages/chocolatey
      - shell: pwsh
        run: |
          choco pack packages/chocolatey/xmtr.nuspec --outputdirectory packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install xmtr --source "$PWD/packages" --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          xmtr --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco uninstall xmtr --yes --no-progress
      - uses: actions/upload-artifact@v4
        with:
          name: packages-chocolatey
          path: packages/*.nupkg

  # Builds the image for every platform; the amd64 image runs once.
  docker:
    needs: zigbuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*-linux-musl*
          path: dist
          merge-multiple: true
      - id: context
        run: echo "platforms=$(scripts/docker-context.sh dist docker)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker buildx build --platform linux/amd64 --load --tag xmtr:test --file packaging/Dockerfile docker
          docker run --rm xmtr:test --version
          docker buildx build --platform "${{ steps.context.outputs.platforms }}" --file packaging/Dockerfile docker

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, nix, zigbuild, cross, android, packages, chocolatey, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: packages-linux
          path: dist
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      # Releases are immutable once published, so every file is attached to a draft first.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease --latest=false" ;; esac
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" --draft --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes $prerelease
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"

  crates:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in xmtr-release xmtr; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'xmtr release workflow (xmtr.opensource@xmsl.dev)' "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$status" = 200 ]; then
              echo "${crate} ${version} is already on crates.io"
            else
              cargo publish --locked --package "$crate"
            fi
          done

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --dir dist --repo "${GITHUB_REPOSITORY}"
      - run: scripts/package-managers.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS packages
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_KEY }}
      - run: |
          git clone --depth 1 git@github.com:Alice39s/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp packages/homebrew/Formula/xmtr.rb tap/Formula/xmtr.rb
          cd tap
          git config user.name Alice39s
          git config user.email xmtr.opensource@xmsl.dev
          git add Formula/xmtr.rb
          git diff --cached --quiet || git commit -m "xmtr ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  scoop:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --dir dist --repo "${GITHUB_REPOSITORY}"
      - run: scripts/package-managers.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS packages
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SCOOP_BUCKET_KEY }}
      - run: |
          git clone --depth 1 git@github.com:Alice39s/scoop-bucket.git bucket
          mkdir -p bucket/bucket
          cp packages/scoop/bucket/xmtr.json bucket/bucket/xmtr.json
          cd bucket
          git config user.name Alice39s
          git config user.email xmtr.opensource@xmsl.dev
          git add bucket/xmtr.json
          git diff --cached --quiet || git commit -m "xmtr ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main

  aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --dir dist --repo "${GITHUB_REPOSITORY}"
      - run: scripts/package-managers.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS packages
      # Builds the package once in Arch Linux to check the sources and checksums, and writes .SRCINFO.
      - run: |
          docker run --rm -v "$PWD/packages/aur:/pkg" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            chown -R builder /pkg
            su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO && makepkg -f --noconfirm"
            rm -rf /pkg/src /pkg/pkg /pkg/*.tar.gz /pkg/*.pkg.tar.zst
          '
          cat packages/aur/.SRCINFO
      - if: vars.AUR_ENABLED == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_KEY }}
      - if: vars.AUR_ENABLED == 'true'
        run: |
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git clone ssh://aur@aur.archlinux.org/xmtr-bin.git aur
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO aur/
          cd aur
          git config user.name Alice39s
          git config user.email xmtr.opensource@xmsl.dev
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "xmtr-bin ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

  winget:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # The action updates an existing package, so it runs once the first version is in winget-pkgs.
      - id: listed
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/a/Alice39s/xmtr)"
          echo "listed=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.listed.outputs.listed == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Alice39s.xmtr
          installers-regex: '^xmtr-.*-windows-.*\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v5
        with:
          name: packages-npm
          path: npm
      # Trusted publishing signs in through OIDC. The platform packages go first, so @xmtr/cli
      # never points at a version that is missing.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          for tarball in ./npm/platforms/*.tgz "./npm/xmtr-cli-${version}.tgz"; do
            name="$(tar -xzOf "$tarball" package/package.json | jq -r .name)"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name} ${version} is already on npm"
            else
              npm publish "$tarball" --access public --tag "$tag"
            fi
          done

  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages-wheels
          path: wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true

  # Publishes the apt, dnf and apk repositories at https://alice39s.github.io/xmtr/.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: packages-linux
          path: packages
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq reprepro createrepo-c
      - env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          printf '%s\n' "$PACKAGES_GPG_KEY" | gpg --batch --quiet --import
          printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/xmtr.rsa"
          GPG_KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')" \
            APK_SIGNING_KEY_FILE="$RUNNER_TEMP/xmtr.rsa" scripts/linux-repos.sh packages site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  docker-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: xmtr-*-linux-musl*
          path: dist
          merge-multiple: true
      - id: context
        run: |
          echo "platforms=$(scripts/docker-context.sh dist docker)" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/alice39s/xmtr:${version}"
          case "$version" in *-*) ;; *) tags="${tags},ghcr.io/alice39s/xmtr:latest" ;; esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: packaging/Dockerfile
          platforms: ${{ steps.context.outputs.platforms }}
          push: true
          tags: ${{ steps.context.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Alice39s/xmtr
            org.opencontainers.image.version=${{ steps.context.outputs.version }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          annotations: |
            index:org.opencontainers.image.source=https://github.com/Alice39s/xmtr
            index:org.opencontainers.image.description=Concurrent traceroute that maps every hop on xmsl.dev IPMap
            index:org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/alice39s/xmtr
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chocolatey-publish:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages-chocolatey
          path: packages
      # New versions wait for moderation before they appear on community.chocolatey.org.
      - shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $package = Get-ChildItem packages/*.nupkg
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
