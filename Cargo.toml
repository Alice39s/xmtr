[workspace]
members = [".", "crates/release", "crates/installer"]
exclude = ["vendor/trippy-core"]
resolver = "3"

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alice39s/xmtr"
homepage = "https://xmsl.dev/ipmap"

[workspace.dependencies]
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# The version must match workspace.package.version; the release workflow checks it.
xmtr-release = { path = "crates/release", version = "0.2.6" }

[package]
name = "xmtr"
description = "Concurrent traceroute built on trippy that publishes routes to xmsl.dev IPMap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["traceroute", "mtr", "network", "trippy", "geolocation"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# cargo binstall downloads the release archive instead of building from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/xmtr-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.i686-pc-windows-gnu]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-gnullvm]
pkg-fmt = "zip"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7"
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tokio",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "webpki-roots",
] }
humantime = "2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
trippy-core = "0.13"
trippy-privilege = "0.13"
ureq = { workspace = true, features = ["json"] }
xmtr-release.workspace = true

# Reading the macOS resolver through SystemConfiguration needs the macOS SDK, which Linux cross builds lack.
[target.'cfg(not(target_os = "macos"))'.dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config"] }

[target.'cfg(target_os = "macos")'.dependencies]
resolv-conf = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.xmtr-installer]
opt-level = "z"

# trippy-core 0.13.0 with Android handled like Linux when it picks the IPv4 header byte order;
# see vendor/README.md.
[patch.crates-io]
trippy-core = { path = "vendor/trippy-core" }
