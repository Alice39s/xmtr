[workspace]
members = [".", "crates/release", "crates/installer"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alice39s/xmtr"

[workspace.dependencies]
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
xmtr-release = { path = "crates/release" }

[package]
name = "xmtr"
description = "Concurrent traceroute built on trippy that publishes routes to xmsl.dev IPMap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7"
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tokio",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "webpki-roots",
] }
humantime = "2"
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
trippy-core = "0.13"
trippy-privilege = "0.13"
ureq = { workspace = true, features = ["json"] }
xmtr-release.workspace = true

# Reading the macOS resolver through SystemConfiguration needs the macOS SDK, which Linux cross builds lack.
[target.'cfg(not(target_os = "macos"))'.dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config"] }

[target.'cfg(target_os = "macos")'.dependencies]
resolv-conf = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.xmtr-installer]
opt-level = "z"
